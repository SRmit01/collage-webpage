
<!DOCTYPE html>
<html>
<head>
    <title>My Online Store</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            text-align: center;
            background: #f4f4f4;
        }
        header {
            background: #222;
            color: white;
            padding: 15px;
        }
        nav a {
            color: white;
            margin: 15px;
            text-decoration: none;
        }
        .products {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 30px;
        }
        .product {
            background: white;
            padding: 20px;
            border-radius: 8px;
        }
        button {
            background: #28a745;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<header>
    <h1>My Online Store</h1>
    <nav>
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#">Contact</a>
    </nav>
</header>

<h2>Our Products</h2>

<div class="products">
    <div class="product">
        <h3>T-Shirt</h3>
        <p>Price: ₹499</p>
        <button>Add to Cart</button>
    </div>

    <div class="product">
        <h3>Shoes</h3>
        <p>Price: ₹999</p>
        <button>Add to Cart</button>
    </div>

    <div class="product">
        <h3>Watch</h3>
        <p>Price: ₹799</p>
        <button>Add to Cart</button>
    </div>
</div>

</body>
</html>
